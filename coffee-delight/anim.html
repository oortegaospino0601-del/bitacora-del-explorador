<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
const W=1080,H=1920,CX=505,CY=820,TAU=Math.PI*2;
// scene start times (s); last = end
window.SC=window.SC||[0,2,6,12,15,19,22,26,31,37,39.5];
const CAPS=['Natilla con sabor a café\u00A0☕','El truco: Coffee Delight Clásico','750 ml leche · 150 g panela · canela · 20 caramelos','Fuego medio hasta que se disuelvan','250 ml leche fría + 120 g fécula','10 min revolviendo sin parar','Mantequilla → molde → nevera 2 h','Encima: 6 caramelos triturados','Café de bolsillo para la\u00A0novena\u00A0☕','Guárdala para el\u00A016\u00A0🎄'];

// ---------- helpers
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const P=(u,a,b)=>clamp((u-a)/(b-a));
const eo=t=>1-Math.pow(1-t,3), ei=t=>t*t*t, eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const back=t=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const bounce=x=>{const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375};
const R=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>{a=hex(a);b=hex(b);return `rgb(${a.map((v,i)=>Math.round(lerp(v,b[i],t))).join(',')})`};
function rr(x,y,w,h,r){X.beginPath();X.roundRect(x,y,w,h,r);}
function circ(x,y,r){X.beginPath();X.arc(x,y,r,0,TAU);}
function ell(x,y,rx,ry,rot=0){X.beginPath();X.ellipse(x,y,rx,ry,rot,0,TAU);}
function shadow(x,y,rx,ry,a=.25){X.fillStyle=`rgba(0,0,0,${a})`;ell(x,y,rx,ry);X.fill();}

// ---------- product: package (local size 380x500)
function pkg(x,y,s=1,rot=0,opened=0){
  X.save();X.translate(x,y);X.rotate(rot);X.scale(s,s);
  const w=380,h=500;
  shadow(0,h/2+10,w*.46,24,.28);
  // body
  X.beginPath();X.moveTo(-w/2,-h/2+34);X.quadraticCurveTo(-w/2-16,0,-w/2,h/2-34);X.lineTo(w/2,h/2-34);X.quadraticCurveTo(w/2+16,0,w/2,-h/2+34);X.closePath();
  let g=X.createLinearGradient(-w/2,0,w/2,0);g.addColorStop(0,'#26140a');g.addColorStop(.45,'#4d2b16');g.addColorStop(1,'#26140a');
  X.fillStyle=g;X.fill();
  // crimps
  const crimp=(cy,flip)=>{let cg=X.createLinearGradient(0,cy-20,0,cy+20);cg.addColorStop(0,'#f1cf7c');cg.addColorStop(.5,'#c08f3a');cg.addColorStop(1,'#8f6524');
    X.fillStyle=cg;X.beginPath();X.moveTo(-w/2-4,cy+17*flip);
    for(let k=0;k<=24;k++){X.lineTo(-w/2-4+k*(w+8)/24,cy-17*flip+(k%2?-8:0)*flip);}X.lineTo(w/2+4,cy+17*flip);X.closePath();X.fill();
    X.strokeStyle='rgba(90,60,20,.45)';X.lineWidth=2;for(let k=1;k<24;k++){X.beginPath();X.moveTo(-w/2+k*w/24,cy-14);X.lineTo(-w/2+k*w/24,cy+14);X.stroke();}};
  crimp(h/2-30,-1);
  if(opened<1){X.save();X.translate(opened*140,-opened*220);X.rotate(opened*.8);X.globalAlpha=1-opened;crimp(-h/2+30,1);X.restore();}
  else{X.fillStyle='#e9dcc4';X.beginPath();X.moveTo(-w/2,-h/2+40);for(let k=0;k<=12;k++)X.lineTo(-w/2+k*w/12,-h/2+40+(k%2?10:-4));X.lineTo(w/2,-h/2+52);X.lineTo(-w/2,-h/2+52);X.fill();}
  // gloss
  let gl=X.createLinearGradient(-w/2,0,w/2,0);gl.addColorStop(.12,'rgba(255,255,255,0)');gl.addColorStop(.2,'rgba(255,255,255,.16)');gl.addColorStop(.3,'rgba(255,255,255,0)');
  X.fillStyle=gl;X.fillRect(-w/2,-h/2+50,w,h-100);
  // top ribbon
  X.fillStyle='#c9993f';rr(-150,-178,300,44,22);X.fill();
  X.fillStyle='#2a160b';X.font='800 23px Inter';X.textAlign='center';X.textBaseline='middle';X.fillText('CARAMELOS DE CAFÉ',0,-155);
  // logo
  X.save();X.transform(1,0,-.18,1,0,0);X.fillStyle='#f6e7c8';X.shadowColor='rgba(0,0,0,.5)';X.shadowBlur=8;X.shadowOffsetY=3;
  X.font='900 92px Inter';X.fillText('Coffee',8,-75);X.font='900 82px Inter';X.fillText('Delight',14,8);X.restore();
  X.strokeStyle='#d8aa52';X.lineWidth=5;X.beginPath();X.moveTo(-120,58);X.quadraticCurveTo(0,80,120,58);X.stroke();
  // variant badge
  X.fillStyle='#e6b85c';rr(-95,78,190,50,25);X.fill();X.fillStyle='#2a160b';X.font='900 30px Inter';X.fillText('CLÁSICO',0,104);
  // illustration: beans + candy
  bean(-80,178,1,-.5);bean(-38,192,.9,.4);
  candyU(60,180,1.35,.2,0,true);
  X.restore();
}
function bean(x,y,s,r){X.save();X.translate(x,y);X.rotate(r);X.scale(s,s);
  let g=X.createRadialGradient(-6,-8,2,0,0,30);g.addColorStop(0,'#8a5230');g.addColorStop(1,'#3b1d0c');X.fillStyle=g;ell(0,0,22,30);X.fill();
  X.strokeStyle='#24110a';X.lineWidth=4;X.beginPath();X.moveTo(0,-24);X.bezierCurveTo(-8,-8,8,8,0,24);X.stroke();X.restore();}
// unwrapped candy
function candyU(x,y,s=1,rot=0,dissolve=0,noShadow){
  if(dissolve>=1)return;X.save();X.translate(x,y);X.rotate(rot);const k=s*(1-dissolve*.85);X.scale(k,k);
  X.globalAlpha*=1-dissolve*.7;
  if(!noShadow)shadow(4,8,38,22,.25);
  let g=X.createRadialGradient(-10,-10,4,0,0,42);g.addColorStop(0,'#c98a43');g.addColorStop(.6,'#7a3f15');g.addColorStop(1,'#4a230b');
  X.fillStyle=g;ell(0,0,38,27);X.fill();
  X.fillStyle='rgba(255,255,255,.55)';ell(-13,-11,11,5,-.4);X.fill();X.restore();}
// wrapped candy; split>0 separates the wrapper halves
function candyW(x,y,s=1,rot=0,split=0){
  X.save();X.translate(x,y);X.rotate(rot);X.scale(s,s);
  if(split<=0)shadow(4,30,60,10,.22);
  if(split>0)candyU(0,0,1.02,0,0,true);
  for(const side of [-1,1]){
    X.save();X.translate(side*split*55,-split*10);X.rotate(side*split*.35);X.globalAlpha*=1-clamp(split*1.8-.4);
    X.beginPath();
    if(side<0){X.rect(-46,-30,46,60);}else{X.rect(0,-30,46,60);}
    X.save();X.clip();
    let g=X.createLinearGradient(0,-30,0,30);g.addColorStop(0,'#5a3219');g.addColorStop(1,'#2a150a');X.fillStyle=g;rr(-46,-30,92,60,24);X.fill();
    X.fillStyle='#d6a84f';X.fillRect(-46,-6,92,12);
    X.fillStyle='#f6e7c8';X.font='italic 900 13px Inter';X.textAlign='center';X.textBaseline='middle';X.fillText('Coffee',0,-17);X.fillText('Delight',0,18);
    X.fillStyle='#2a160b';X.font='800 8px Inter';X.fillText('CLÁSICO',0,1);
    X.restore();
    // twist
    let tg=X.createLinearGradient(side*44,0,side*92,0);tg.addColorStop(0,'#c39339');tg.addColorStop(1,'#f0cf7d');X.fillStyle=tg;
    X.beginPath();X.moveTo(side*44,-6);X.lineTo(side*92,-28);X.lineTo(side*86,0);X.lineTo(side*92,28);X.lineTo(side*44,6);X.closePath();X.fill();
    X.strokeStyle='rgba(110,75,20,.6)';X.lineWidth=2;for(const yy of[-14,0,14]){X.beginPath();X.moveTo(side*48,yy*.2);X.lineTo(side*88,yy);X.stroke();}
    X.restore();
  }
  X.restore();
}
// ---------- hands (wrist at origin, fingers toward -y)
function hand(x,y,rot,s=1,curl=0,sleeve='#b3262c'){
  X.save();X.translate(x,y);X.rotate(rot);X.scale(s,s);
  X.fillStyle=sleeve;rr(-92,10,184,900,40);X.fill();
  X.fillStyle='rgba(255,255,255,.85)';rr(-98,0,196,46,22);X.fill();
  X.fillStyle=sleeve;for(let k=0;k<7;k++){circ(-78+k*26,23,6);X.fill();}
  const sk='#e2aa83',sd='#c98c66';
  for(let k=0;k<4;k++){const fx=-52+k*35,len=(k==0||k==3?100:120)*(1-curl*.55);
    X.fillStyle=sd;rr(fx-17,-150-len+22,34,len,17);X.fill();X.fillStyle=sk;rr(fx-15,-150-len+22,30,len-4,15);X.fill();
    X.fillStyle='rgba(255,235,220,.6)';rr(fx-9,-150-len+28,18,16,8);X.fill();}
  X.fillStyle=sk;rr(-74,-170,148,182,60);X.fill();
  X.save();X.translate(-66,-70);X.rotate(-.75+curl*.5);X.fillStyle=sd;rr(-17,-112,34,112,17);X.fill();X.fillStyle=sk;rr(-15,-110,30,108,15);X.fill();X.restore();
  X.fillStyle='rgba(150,90,60,.18)';ell(10,-80,40,55);X.fill();
  X.restore();
}
// ---------- decor
function lights(t,y0=170){
  X.strokeStyle='#2d4a2b';X.lineWidth=4;X.beginPath();
  const yy=x=>y0+Math.sin(x/W*Math.PI*2.2)*40+40;X.moveTo(-20,yy(-20));for(let x=-20;x<=W+20;x+=20)X.lineTo(x,yy(x));X.stroke();
  const cols=['#ff4d4d','#ffd25a','#4fd17a','#fff3c4','#ff8c3a'];
  for(let k=0;k<14;k++){const x=20+k*80,y=yy(x)+18,c=cols[k%5],f=.6+.4*Math.sin(t*3+k*1.7);
    let g=X.createRadialGradient(x,y,2,x,y,46);g.addColorStop(0,c);g.addColorStop(1,'rgba(255,255,255,0)');X.globalAlpha=.45*f;X.fillStyle=g;circ(x,y,46);X.fill();
    X.globalAlpha=1;X.fillStyle=c;ell(x,y,10,15);X.fill();X.fillStyle='#2d4a2b';X.fillRect(x-6,y-20,12,8);}
}
function bokeh(t,seed,n=14,area=[0,0,W,H],alpha=.25){
  for(let k=0;k<n;k++){const x=area[0]+R(seed+k)*area[2],y=area[1]+R(seed+k*3.1)*area[3],r=20+R(seed+k*7)*50,f=.6+.4*Math.sin(t*1.5+k);
    const cs=['255,210,120','255,120,100','140,230,160','255,245,210'];
    let g=X.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${cs[k%4]},${alpha*f})`);g.addColorStop(1,`rgba(${cs[k%4]},0)`);X.fillStyle=g;circ(x,y,r);X.fill();}
}
function bgKitchen(t,counterY=1000){
  let g=X.createLinearGradient(0,0,W,counterY);g.addColorStop(0,'#f7e8d3');g.addColorStop(1,'#e8cfae');X.fillStyle=g;X.fillRect(0,0,W,counterY);
  X.strokeStyle='rgba(150,110,70,.13)';X.lineWidth=3;
  for(let y=0;y<counterY;y+=90){X.beginPath();X.moveTo(0,y);X.lineTo(W,y);X.stroke();
    for(let x=((y/90)%2)*60;x<W;x+=120){X.beginPath();X.moveTo(x,y);X.lineTo(x,y+90);X.stroke();}}
  let rg=X.createRadialGradient(120,380,40,120,380,900);rg.addColorStop(0,'rgba(255,251,238,.6)');rg.addColorStop(1,'rgba(255,251,238,0)');X.fillStyle=rg;X.fillRect(0,0,W,counterY);
  bokeh(t,3,10,[0,250,W,700],.22);
  lights(t);
  let cg=X.createLinearGradient(0,counterY,0,H);cg.addColorStop(0,'#b07843');cg.addColorStop(1,'#6a4122');X.fillStyle=cg;X.fillRect(0,counterY,W,H-counterY);
  X.strokeStyle='rgba(70,35,12,.2)';X.lineWidth=3;
  for(let k=0;k<9;k++){const y=counterY+40+k*100;X.beginPath();X.moveTo(0,y);X.bezierCurveTo(300,y+20*R(k),700,y-25*R(k+9),W,y+10);X.stroke();}
  X.fillStyle='rgba(255,240,220,.18)';X.fillRect(0,counterY,W,8);
  // pine sprig decor
  sprig(950,counterY+60,1,-.3);sprig(80,counterY+480,1.1,2.6);
}
function sprig(x,y,s,r){X.save();X.translate(x,y);X.rotate(r);X.scale(s,s);X.strokeStyle='#5a3a1e';X.lineWidth=6;X.beginPath();X.moveTo(0,0);X.lineTo(0,-200);X.stroke();
  X.strokeStyle='#2f6b3c';X.lineWidth=5;for(let k=0;k<16;k++){const yy=-12*k;X.beginPath();X.moveTo(0,yy);X.lineTo(-40,yy-26);X.moveTo(0,yy);X.lineTo(40,yy-26);X.stroke();}
  X.fillStyle='#d93838';circ(18,-40,13);X.fill();circ(-10,-58,11);X.fill();X.restore();}
function bgStore(t){
  X.fillStyle='#ead6b5';X.fillRect(0,0,W,H);
  bokeh(t,11,6,[0,300,W,600],.15);
  // shelves with unlabeled goods
  for(const [sy,kind] of [[430,'jars'],[650,'mix'],[870,'eggs']]){
    X.fillStyle='#8a5a33';X.fillRect(0,sy,W,22);X.fillStyle='rgba(0,0,0,.15)';X.fillRect(0,sy+22,W,14);
    for(let k=0;k<8;k++){const x=50+k*130;
      if(kind=='jars'||(kind=='mix'&&k%2==0)){const fill=['#f3ead6','#7a2a22','#e8b93c','#efe7d6'][k%4];
        X.fillStyle='rgba(255,255,255,.35)';rr(x,sy-150,92,150,16);X.fill();X.fillStyle=fill;rr(x+6,sy-110,80,104,10);X.fill();
        X.fillStyle='rgba(0,0,0,.08)';for(let d=0;d<18;d++){circ(x+12+R(k*30+d)*68,sy-104+R(k*17+d)*92,4);X.fill();}
        X.fillStyle='#b98a52';rr(x+4,sy-166,84,22,6);X.fill();X.fillStyle='rgba(255,255,255,.4)';X.fillRect(x+14,sy-140,10,120);}
      else if(kind=='mix'){X.fillStyle='#c7d64a';for(let b=0;b<4;b++){X.save();X.translate(x+40,sy-20);X.rotate(-.9+b*.25);rr(-12,-120,26,120,13);X.fill();X.restore();}}
      else{X.fillStyle='#c9b593';rr(x,sy-40,110,40,6);X.fill();for(let e=0;e<3;e++){X.fillStyle='#f6ead6';ell(x+20+e*35,sy-50,16,22);X.fill();}}}
  }
  // awning + sign (decor)
  for(let k=0;k<12;k++){X.fillStyle=k%2?'#fff4e6':'#c8342f';X.beginPath();X.moveTo(k*90,0);X.lineTo(k*90+90,0);X.lineTo(k*90+90,150);X.arc(k*90+45,150,45,0,Math.PI);X.closePath();X.fill();}
  X.fillStyle='#2f6b3c';rr(270,40,540,80,16);X.fill();X.fillStyle='#fff4e6';X.font='900 44px Inter';X.textAlign='center';X.textBaseline='middle';X.fillText('TIENDA LA ESQUINA',540,82);
  lights(t,175);
  // counter
  let cg=X.createLinearGradient(0,1000,0,1160);cg.addColorStop(0,'#c08a52');cg.addColorStop(1,'#9b6a3a');X.fillStyle=cg;X.fillRect(0,1000,W,160);
  X.fillStyle='#7c5230';X.fillRect(0,1160,W,H-1160);
  X.strokeStyle='rgba(40,20,5,.3)';X.lineWidth=4;for(let k=0;k<9;k++){X.beginPath();X.moveTo(k*135,1160);X.lineTo(k*135,H);X.stroke();}
  X.fillStyle='rgba(255,255,255,.12)';X.fillRect(0,1000,W,6);
}
function bgStove(t){
  X.fillStyle='#3a3431';X.fillRect(0,0,W,H);
  X.strokeStyle='rgba(255,255,255,.05)';X.lineWidth=3;for(let k=0;k<12;k++){X.beginPath();X.moveTo(0,k*170);X.lineTo(W,k*170);X.stroke();X.beginPath();X.moveTo(k*170,0);X.lineTo(k*170,H);X.stroke();}
  // towel (decor, bottom-left)
  X.save();X.translate(150,1620);X.rotate(-.25);for(let i=0;i<8;i++)for(let j=0;j<6;j++){X.fillStyle=(i+j)%2?'#f3ece2':'#c0342f';X.fillRect(-240+i*60,-180+j*60,60,60);}X.restore();
  sprig(1000,260,1,2.3);
  for(let k=0;k<3;k++){X.save();X.translate(110+k*30,330+k*40);X.rotate(.4+k*.2);X.fillStyle='#9b5a2b';rr(-90,-15,180,30,14);X.fill();X.restore();}
  let g=X.createRadialGradient(CX,CY,200,CX,CY,520);g.addColorStop(0,'rgba(255,120,40,.18)');g.addColorStop(1,'rgba(255,120,40,0)');X.fillStyle=g;circ(CX,CY,520);X.fill();
}
function pot(cx,cy){
  X.fillStyle='#232323';rr(cx-440,cy-30,120,60,28);X.fill();rr(cx+320,cy-30,120,60,28);X.fill();
  let g=X.createRadialGradient(cx-80,cy-80,40,cx,cy,340);g.addColorStop(0,'#f2f2f2');g.addColorStop(1,'#8a8a8a');X.fillStyle=g;circ(cx,cy,335);X.fill();
  g=X.createRadialGradient(cx+40,cy+40,40,cx,cy,310);g.addColorStop(0,'#cfcfcf');g.addColorStop(1,'#6a6a6a');X.fillStyle=g;circ(cx,cy,308);X.fill();
  X.fillStyle='#a3a3a3';circ(cx,cy,290);X.fill();
}
function liquid(cx,cy,r,col,t,swirl=0,thick=0){
  if(r<=0)return;X.save();circ(cx,cy,r);X.clip();X.fillStyle=col;X.fillRect(cx-r,cy-r,2*r,2*r);
  let g=X.createRadialGradient(cx-90,cy-110,10,cx,cy,r);g.addColorStop(0,'rgba(255,255,255,.35)');g.addColorStop(.5,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,0,0,.18)');X.fillStyle=g;X.fillRect(cx-r,cy-r,2*r,2*r);
  if(swirl>0){X.strokeStyle=`rgba(255,255,255,${.22*swirl})`;X.lineWidth=6;for(let a=0;a<3;a++){X.beginPath();for(let k=0;k<120;k++){const th=k*.09+t*2.4+a*2.1,rad=k*2.2;const x=cx+Math.cos(th)*rad,y=cy+Math.sin(th)*rad;k?X.lineTo(x,y):X.moveTo(x,y);}X.stroke();}}
  if(thick>0){X.strokeStyle=`rgba(90,50,20,${.25*thick})`;X.lineWidth=8;for(let k=1;k<7;k++){X.beginPath();for(let a=0;a<=64;a++){const th=a/64*TAU,rad=k*40+Math.sin(th*5+t*3+k)*8*thick;const x=cx+Math.cos(th+t*.8)*rad,y=cy+Math.sin(th+t*.8)*rad;a?X.lineTo(x,y):X.moveTo(x,y);}X.stroke();}}
  X.restore();
}
function steam(cx,cy,t,a=1){X.save();X.lineCap='round';for(let k=0;k<4;k++){const ph=(t*.6+k*.25)%1;X.strokeStyle=`rgba(255,255,255,${.28*a*Math.sin(ph*Math.PI)})`;X.lineWidth=16;X.beginPath();
  const x0=cx-150+k*100,y0=cy+60-ph*360;for(let j=0;j<20;j++){const y=y0-j*12,x=x0+Math.sin(j*.5+t*3+k)*18;j?X.lineTo(x,y):X.moveTo(x,y);}X.stroke();}X.restore();}
function spoonTop(cx,cy,ang,len=620){X.save();X.translate(cx,cy);X.rotate(ang);
  X.fillStyle='rgba(0,0,0,.25)';rr(30,-10,len,36,18);X.fill();
  let g=X.createLinearGradient(0,-20,0,20);g.addColorStop(0,'#d9a066');g.addColorStop(1,'#a0662f');X.fillStyle=g;rr(40,-18,len,36,18);X.fill();
  ell(0,0,70,50);X.fill();X.fillStyle='rgba(80,40,10,.25)';ell(0,0,52,36);X.fill();X.restore();}
function fall(x,y,p,draw){ // top-down drop: scale from big to normal
  if(p<=0)return;const e=eo(p);X.save();X.globalAlpha=clamp(p*3);X.translate(x,y);X.scale(lerp(1.8,1,e),lerp(1.8,1,e));draw();X.restore();}
function burst(x,y,p,txt){if(p<=0||p>=1)return;const s=back(clamp(p*3));X.save();X.translate(x,y);X.scale(s,s);X.globalAlpha=1-clamp((p-.7)/.3);
  X.font='900 40px Inter';const tw=X.measureText(txt).width/2+40;X.fillStyle='#ffd25a';X.beginPath();for(let k=0;k<28;k++){const r=k%2?1:1.35,a=k/28*TAU;X.lineTo(Math.cos(a)*tw*r,Math.sin(a)*68*r);}X.closePath();X.fill();

  X.fillStyle='#2a160b';lines.forEach((l,i)=>X.fillText(l,x,y+20+fs*.95+i*lh));
  X.restore();
}
function vignette(){let g=X.createRadialGradient(W/2,H/2,500,W/2,H/2,1200);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(30,15,5,.35)');X.fillStyle=g;X.fillRect(0,0,W,H);}

window.render=function(t,guides){
  const SC=window.SC;X.setTransform(1,0,0,1,0,0);X.globalAlpha=1;X.clearRect(0,0,W,H);
  let i=0;while(i<SC.length-2&&t>=SC[i+1])i++;
  const u=t-SC[i],D=SC[i+1]-SC[i];
  const punch=1+.035*(1-eo(clamp(u/.3))),hx=Math.sin(t*1.1)*4+Math.sin(t*2.3)*2,hy=Math.cos(t*.9)*4;
  X.save();X.translate(W/2,H/2);X.scale(punch,punch);X.translate(-W/2+hx,-H/2+hy);
  SCN[i](u,D,t);X.restore();X.globalAlpha=1;
  vignette();
  if(CAPS[i])caption(CAPS[i],u);
  if(guides){X.fillStyle='rgba(255,0,0,.28)';X.fillRect(0,0,W,192);X.fillRect(0,1440,W,480);X.fillRect(950,192,130,1248);}
};
