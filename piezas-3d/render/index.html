<!doctype html><html><head><style>html,body{margin:0;background:#f4efe6}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body><script type="module">
import * as THREE from 'three';
import {STLLoader} from 'three/addons/loaders/STLLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const q=new URLSearchParams(location.search);
const W=+q.get('w')||900,H=+q.get('h')||900;
const items=JSON.parse(q.get('items')); // [{f,color,x}]
const az=+(q.get('az')||25), el=+(q.get('el')||18), dist=+(q.get('dist')||120);
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
r.setSize(W,H); r.setPixelRatio(1); r.shadowMap.enabled=true; r.shadowMap.type=THREE.PCFSoftShadowMap;
r.toneMapping=THREE.ACESFilmicToneMapping; r.toneMappingExposure=1.0;
document.body.appendChild(r.domElement);
const s=new THREE.Scene(); s.background=new THREE.Color('#f4efe6');
const pm=new THREE.PMREMGenerator(r); s.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;
const cam=new THREE.PerspectiveCamera(24,W/H,1,2000);
const ty=+(q.get('ty')||19);
const a=az*Math.PI/180,e=el*Math.PI/180;
// three.js: y up. Model: z up, face +y  -> rotate -90 about X so model +y -> -z? we map model(x,y,z)->(x,z,-y)... use +y->+z
cam.position.set(dist*Math.cos(e)*Math.sin(a), ty+dist*Math.sin(e), dist*Math.cos(e)*Math.cos(a));
cam.lookAt(+(q.get('tx')||0),ty,0);
const sun=new THREE.DirectionalLight(0xffffff,2.2); sun.position.set(40,90,70); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); Object.assign(sun.shadow.camera,{left:-120,right:120,top:120,bottom:-120,near:1,far:400}); sun.shadow.bias=-0.0004; sun.shadow.radius=4;
s.add(sun); s.add(new THREE.HemisphereLight(0xffffff,0xd9cbb5,0.6));
const fill=new THREE.DirectionalLight(0xffffff,0.5); fill.position.set(-60,30,-40); s.add(fill);
const g=new THREE.Mesh(new THREE.PlaneGeometry(1000,1000),new THREE.ShadowMaterial({opacity:0.18}));
g.rotation.x=-Math.PI/2; g.receiveShadow=true; s.add(g);
const L=new STLLoader(); let n=0;
for(const it of items){ L.load(it.f+'?v='+Date.now(),geo=>{
  geo.computeVertexNormals();
  const m=new THREE.Mesh(geo,new THREE.MeshPhysicalMaterial({color:it.color,roughness:0.55,metalness:0,clearcoat:0.15,clearcoatRoughness:0.6,sheen:0.2}));
  m.rotation.x=-Math.PI/2; m.position.x=it.x||0; m.position.z=it.z||0; m.rotation.z=(it.rz||0)*Math.PI/180;
  m.castShadow=true; m.receiveShadow=true; s.add(m);
  if(++n===items.length){ r.render(s,cam); document.title='done'; }
});}
</script></body></html>
